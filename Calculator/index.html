<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Concepts Calculator</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="calculator-container">
        <div class="calculator">
            <!-- Calculator Screen Display -->
            <div class="display">
                <div id="history" class="display-history"></div>
                <div id="screen" class="display-main">0</div>
            </div>

            <!-- Keypad Grid -->
            <div class="keypad">
                <button class="btn btn-action" onclick="calculator.clearAll()">AC</button>
                <button class="btn btn-action" onclick="calculator.deleteLast()">DEL</button>
                <button class="btn btn-action" onclick="calculator.appendOperator('%')">%</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('/')">÷</button>

                <button class="btn" onclick="calculator.appendNumber('7')">7</button>
                <button class="btn" onclick="calculator.appendNumber('8')">8</button>
                <button class="btn" onclick="calculator.appendNumber('9')">9</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('*')">×</button>

                <button class="btn" onclick="calculator.appendNumber('4')">4</button>
                <button class="btn" onclick="calculator.appendNumber('5')">5</button>
                <button class="btn" onclick="calculator.appendNumber('6')">6</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('-')">-</button>

                <button class="btn" onclick="calculator.appendNumber('1')">1</button>
                <button class="btn" onclick="calculator.appendNumber('2')">2</button>
                <button class="btn" onclick="calculator.appendNumber('3')">3</button>
                <button class="btn btn-operator" onclick="calculator.appendOperator('+')">+</button>

                <button class="btn zero" onclick="calculator.appendNumber('0')">0</button>
                <button class="btn" onclick="calculator.appendNumber('.')">.</button>
                <button class="btn btn-equal" onclick="calculator.calculate()">=</button>


            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
